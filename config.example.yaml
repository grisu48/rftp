# Example configuration for rftp, a read-only anonymous FTP server.
# Start with: ./rftp -config config.example.yaml
#
# Every key below can also be set via an environment variable named RFTP_
# + uppercased key, e.g. listen_addr -> RFTP_LISTEN_ADDR, or run without
# -config at all, e.g.:
#   RFTP_LISTEN_ADDR=":21" RFTP_SERVE_DIR=/srv/ftp ./rftp
# The config file takes precedence over environment variables per key.

# Server settings
listen_addr: ":21"          # Listen address; a wildcard address gives dual-stack IPv4/IPv6
passive_enabled: true       # Passive mode (PASV/EPSV) is enabled by default; set false to disable
passive_port_min: 40000     # Passive port range (only used when passive_enabled: true)
passive_port_max: 40100
bandwidth_limit: 0          # Per-connection bandwidth limit in bytes/sec (0 = unlimited, default);
                            # human-readable values also work, e.g. "512KiB/s", "10MB/s"

# Security settings
serve_dir: /srv/ftp         # The single directory to serve (chrooted into when run as root)
user: "65534"               # Optional: user to drop privileges to — a name (e.g. "nobody",
                            # resolved via the user database) or a numeric uid
                            # (default: 65534, the conventional nobody ID)
group: "65534"              # Optional: group to drop privileges to — a name (e.g. "nogroup")
                            # or a numeric gid (default: 65534, the conventional nogroup ID)
chroot: true                # Chroot into serve_dir (requires root; startup fails if it cannot be applied)
read_only_mount: true       # Re-mount serve_dir read-only in a private mount namespace (requires root + CAP_SYS_ADMIN; startup fails if it cannot be applied; the rest of the system is unaffected)

# Logging (info/debug go to stdout, warn/error go to stderr)
log_level: info             # One of: debug, info, warn, error
