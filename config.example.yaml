# Example configuration for rftp, a read-only anonymous FTP server.
# Start with: ./rftp -config config.example.yaml

# Server settings
listen_addr: ":21"          # Listen address; a wildcard address gives dual-stack IPv4/IPv6
passive_enabled: false      # Passive mode (PASV/EPSV) is disabled by default
passive_port_min: 40000     # Passive port range (only used when passive_enabled: true)
passive_port_max: 40100

# Security settings
serve_dir: /srv/ftp         # The single directory to serve (chrooted into when run as root)
user: nobody                # Privileges are dropped to this user after binding
group: nogroup              # Privileges are dropped to this group after binding
chroot: true                # Chroot into serve_dir (requires root)
read_only_mount: true       # Re-mount serve_dir read-only (requires root)

# Logging (info/debug go to stdout, warn/error go to stderr)
log_level: info             # One of: debug, info, warn, error
